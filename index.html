<style>
/* ===== DESIGN SYSTEM =====
 Color    : 4 tokens per theme (bg, fg, mid, faint) + ink (reading text, contrast-adjusted). Monochrome only.
 Type     : Silkscreen (pixel labels) / IBM Plex Mono (data) / Literata (titles + reading).
 Space    : 4 · 8 · 12 · 16 · 24 · 32
 Borders  : 2px solid in Pixel mode (stepped corners), 1px otherwise. No shadows, no gradients, no motion.
 Targets  : 44-48px minimum.
*/
:root{
  --bg:#EDE7D8;--fg:#23211D;--mid:#7A7568;--faint:#CFC8B6;--ink:#23211D;--hlbg:#D3CCBA;
  --f-label:'Silkscreen Embedded','Silkscreen','Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  --f-mono:'Plex Embedded','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-serif:'Literata Embedded','Literata',Georgia,'Times New Roman',serif;
  --bw:1px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --fx:16px;--pad:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2A2A2A;--fg:#C4C4C0;--mid:#8A8A86;--faint:#3C3C3C;--ink:#C4C4C0}}
:root[data-theme="dark"]{--bg:#2A2A2A;--fg:#C4C4C0;--mid:#8A8A86;--faint:#3C3C3C;--ink:#C4C4C0}
html.px{--bw:2px}
html{height:100%;height:var(--vh,100%);scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-serif);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border-radius:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
::selection{background:var(--fg);color:var(--bg)}

/* stepped pixel corners */
html.px .btn,html.px .ib,html.px .seg,html.px .card,html.px .dlg,html.px .toast,html.px .cover,html.px .recent,html.px .step,html.px .sb button{
  clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px));
}

.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:var(--bg)}
.hdr{flex:none;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:var(--bw) solid var(--fg)}
.hdr h1{flex:1;margin:0;font-family:var(--f-label);font-size:16px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4)}
.foot{flex:none;padding:var(--s3) var(--s4);border-top:var(--bw) solid var(--fg);background:var(--bg)}
.lbl{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--mid)}
.sec{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin:var(--s5) 0 var(--s2)}
.sec:first-child{margin-top:0}

.btn{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:48px;padding:0 var(--s4);border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2)}
.btn.wide{width:100%}
.btn.solid,.btn:active{background:var(--fg);color:var(--bg)}
.btn:focus-visible{background:var(--fg);color:var(--bg);outline:none}
.btn.solid:active{background:var(--bg);color:var(--fg)}
.btn.danger{border-style:dashed}
.ib{width:48px;height:48px;flex:none;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);display:grid;place-items:center;padding:0;font-family:var(--f-label);font-size:12px}
.ib.plain{border-color:transparent}
.ib:active,.ib.on{background:var(--fg);color:var(--bg)}
.ib:focus-visible{background:var(--fg);color:var(--bg);outline:none}
.ic{display:block;fill:currentColor}

/* segmented control */
.seg{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:var(--bw);background:var(--fg);border:var(--bw) solid var(--fg)}
.seg button{min-height:44px;border:0;background:var(--bg);color:var(--fg);font-family:var(--f-label);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:var(--s1) var(--s2)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.step{display:grid;grid-template-columns:56px 1fr 56px;gap:var(--bw);background:var(--fg);border:var(--bw) solid var(--fg)}
.step button,.step output{min-height:44px;background:var(--bg);display:grid;place-items:center;border:0;font-family:var(--f-mono);font-size:14px}
.step button{font-family:var(--f-label);font-size:16px}
.step button:active{background:var(--fg);color:var(--bg)}

.row{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) 0;border-bottom:1px dotted var(--mid)}
.row>.lbl{display:flex;justify-content:space-between}
.preview{border:var(--bw) solid var(--fg);padding:var(--s4);margin:var(--s2) 0 var(--s3);color:var(--ink)}
.note{font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--mid);margin:var(--s2) 0}
.card{border:var(--bw) solid var(--fg);padding:var(--s4);margin:var(--s3) 0}

/* covers & bars */
.cover{flex:none;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);display:block;overflow:hidden}
.cover svg{display:block;width:100%;height:100%}
.cover.sm{width:44px;height:62px}.cover.md{width:60px;height:84px}.cover.lg{width:96px;height:134px}
.bar{height:10px;border:var(--bw) solid var(--fg);background:var(--bg);flex:1}
html.px .bar{background:repeating-conic-gradient(var(--mid) 0 25%,var(--bg) 0 50%) 0 0/4px 4px}
.bar>i{display:block;height:100%;background:var(--fg)}
.barrow{display:flex;align-items:center;gap:var(--s3)}

/* library */
.recent{display:flex;gap:var(--s4);width:100%;text-align:left;border:var(--bw) solid var(--fg);background:var(--bg);padding:var(--s4)}
.recent:active{background:var(--faint)}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2);justify-content:center}
.t{font-family:var(--f-serif);font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.a{font-family:var(--f-serif);font-size:14px;color:var(--mid)}
.book{display:flex;gap:var(--s3);width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted var(--mid);padding:var(--s3) 0;align-items:center}
.book:active{background:var(--faint)}
.book .t{font-size:16px}
.book .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--mid);flex:none}
.empty{text-align:center;padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s4)}
.empty p{font-family:var(--f-mono);font-size:13px;color:var(--mid);margin:0;max-width:30ch;line-height:1.5}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--mid);text-align:center;margin-top:var(--s2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);margin:var(--s4) 0}
.dl dt{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;align-self:center}
.dl dd{margin:0;font-family:var(--f-mono);font-size:13px;text-align:right}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.trio{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.trio .btn{padding:0 var(--s2);font-size:11px}

/* list screens */
.li{display:flex;align-items:stretch;border-bottom:1px dotted var(--mid)}
.li>.main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:var(--s3) 0;display:flex;flex-direction:column;gap:4px;min-height:56px;justify-content:center}
.li>.main:active{background:var(--faint)}
.li .t{font-size:16px;font-weight:400}
.li.cur .t{font-weight:700}
.li.cur .main::before{content:"> ";font-family:var(--f-label)}
.li .side{display:flex;align-items:center;gap:var(--s1)}
.li mark,.snip mark{background:var(--fg);color:var(--bg);padding:0 1px}
.snip{font-family:var(--f-serif);font-size:15px;line-height:1.4}
.bmnote{font-style:italic;font-size:14px;color:var(--ink)}
.tabs{padding:var(--s3) var(--s4);flex:none;border-bottom:var(--bw) solid var(--fg)}
.sinput{width:100%;min-height:48px;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);font-family:var(--f-mono);font-size:16px;padding:0 var(--s3);border-radius:0}
.sinput:focus{outline:none;background:var(--faint)}
textarea.sinput{padding:var(--s3);min-height:96px;resize:none;font-family:var(--f-serif)}

/* reader */
#s-reader{background:var(--bg)}

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const stripTags = h => h.replace(/<[^>]*>/g, '');
const nameToTitle = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim() || 'Untitled';
function textLen(html){ const t = document.createElement('template'); t.innerHTML = html; return t.content.textContent.length; }
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ================= pixel icons ================= */
const ICONS = {
  back:['....#....','...##....','..###....','.########','#########','.########','..###....','...##....','....#....'],
  close:['##.....##','###...###','.###.###.','..#####..','...###...','..#####..','.###.###.','###...###','##.....##'],

  search:['.#####...','#.....#..','#.....#..','#.....#..','#.....#..','#.....#..','.#####...','......##.','.......##'],
  toc:['##.######','.........','##.######','.........','##.######','.........','##.######','.........','##.######'],
  bm:['.#######.','.#.....#.','.#.....#.','.#.....#.','.#.....#.','.#.....#.','.#.....#.','..#...#..','...#.#...','....#....'],
  bmf:['.#######.','.#######.','.#######.','.#######.','.#######.','.#######.','.#######.','..#####..','...###...','....#....'],
  sliders:['..###....','#########','..###....','.........','.........','.....###.','#########','.....###.','.........'],
  sun:['....#....','.#..#..#.','...###...','..#####..','#.#####.#','..#####..','...###...','.#..#..#.','....#....'],
  theme:['..#####..','.####..#.','#####...#','#####...#','#####...#','#####...#','#####...#','.####..#.','..#####..'],
  trash:['...###...','#########','.#.....#.','.#.#.#.#.','.#.#.#.#.','.#.#.#.#.','.#.#.#.#.','.#.....#.','.#######.'],
  edit:['......##.','.....####','....####.','...####..','..####...','.####....','#####....','##.......'],
  logo:['########...', '#......##..', '#......#.#.', '#......####', '#.........#', '#.#######.#', '#.........#', '#.#######.#', '#.........#', '#.#####...#', '#.........#', '#.#######.#', '#.........#', '###########'],
  phones:['..#####..','.##...##.','.#.....#.','.#.....#.','###...###','###...###','###...###','.#.....#.'],
  speaker:['...#.....','..##...#.','####.#..#','####..#.#','####..#.#','####.#..#','..##...#.','...#.....'],
  expand:['###...###','#.......#','#.......#','.........','.........','.........','#.......#','#.......#','###...###'],
  compress:['.........','.##...##.','.#.....#.','.........','.........','.........','.#.....#.','.##...##.','.........'],
  pause:['###.###','###.###','###.###','###.###','###.###','###.###','###.###','###.###','###.###'],
  play:['#......','##.....','###....','####...','#####..','####...','###....','##.....','#......'],
  stop:['########','########','########','########','########','########','########','########'],
  chev:['#....','##...','###..','####.','#####','####.','###..','##...','#....']
};
function ic(name, cell = 3, flip = false){
  let rows = ICONS[name]; if (flip) rows = rows.map(r => r.split('').reverse().join(''));
  const h = rows.length, w = rows[0].length; let d = '';
  rows.forEach((r, y) => { const m = r.matchAll(/#+/g); for (const x of m) d += `M${x.index} ${y}h${x[0].length}v1h-${x[0].length}z`; });
  return `<svg class="ic ic-${name}" width="${w * cell}" height="${h * cell}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}"/></svg>`;
}
function iconUri(name){ const rows = ICONS[name]; let d = ''; rows.forEach((r, y) => { for (const x of r.matchAll(/#+/g)) d += `M${x.index} ${y}h${x[0].length}v1h-${x[0].length}z`; }); return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${rows[0].length} ${rows.length}' shape-rendering='crispEdges'><path d='${d}'/></svg>`)}")`; }
document.documentElement.style.setProperty('--spk', iconUri('speaker'));
function coverSvg(seed){
  const h = hash(seed); let bits = h, d = '';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 3; x++){
    const on = (hash(seed + ':' + y + ':' + x) >> 3) & 1;
    if (on){ d += `M${5 + x * 8} ${7 + y * 8}h8v8h-8z`; if (x < 2) d += `M${5 + (4 - x) * 8} ${7 + y * 8}h8v8h-8z`; }
  }
  return `<svg viewBox="0 0 50 70" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="${d}"/><path fill="none" stroke="currentColor" stroke-width="1" d="M2.5 2.5h45v65h-45z"/></svg>`;
}
const cover = (b, size) => `<span class="cover art ${size}">${artSvg(validCover(b.cover) ? b.cover : renderSpec(titleSpec(b)))}</span>`;

/* ================= settings ================= */
const DEF = {theme:'paper',font:'lit',size:20,line:1.55,margin:2,para:0,align:'left',layout:'single',pixel:true,contrast:100,tone:0,gray:false,footer:true,turn:'both',hand:'right',orient:'auto',wake:true,refresh:'subtle',dim:100,sort:'recent',weight:'normal',eta:true,auto:0,rate:1,goal:0,voice:'',vstyle:'female',pitch:1,lang:'orig',tq:'quick',uilang:'en',engine:'auto',tserver:'',tkey:'',acc:{}};
let S = {...DEF};
try {
  const raw = localStorage.getItem('inkleaf.s');
  if (raw) S = {...DEF, ...JSON.parse(raw)};
  else { if (matchMedia('(prefers-color-scheme: dark)').matches) S.theme = 'dark'; if (/^bn/i.test(navigator.language || '')) S.uilang = 'bn'; }
} catch(e){}
const saveS = () => { try { localStorage.setItem('inkleaf.s', JSON.stringify(S)); } catch(e){} };
const THEMES = {
  paper:{n:'Paper',bg:[237,231,216],fg:[35,33,29]},
  classic:{n:'Classic e-ink',bg:[208,208,203],fg:[42,42,42]},
  high:{n:'High contrast',bg:[255,255,255],fg:[10,10,10]},
  dark:{n:'Dark e-ink',bg:[42,42,42],fg:[196,196,192]}
};
if (!THEMES[S.theme]) S.theme = 'paper';
const FONTS = {
  lit:{n:'Literata',f:"'Literata Embedded',Literata,Georgia,'Noto Serif',serif"},
  mer:{n:'Merriweather',f:"'Merriweather Embedded',Merriweather,Cambria,'Times New Roman','Noto Serif',serif"},
  ser:{n:'Serif',f:"'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',serif"},
  atk:{n:'Atkinson',f:"'Atkinson Embedded','Atkinson Hyperlegible',Verdana,Tahoma,'Noto Sans',sans-serif"},
  san:{n:'Sans',f:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"},
  mon:{n:'Mono',f:"'Plex Embedded','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace"},
  pxl:{n:'Pixel',f:"'Pixelify Embedded','Pixelify Sans','Silkscreen Embedded','Silkscreen',ui-monospace,Menlo,monospace",z:1.05},
  vt:{n:'Terminal',f:"'VT323 Embedded',VT323,'Plex Embedded',ui-monospace,Menlo,monospace",z:1.4}
};
if (!FONTS[S.font]) S.font = 'lit';
const MX = [8,18,28,40,56], MY = [12,18,24,30,38];
const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const hex = c => '#' + c.map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
function applyTheme(){
  const t = THEMES[S.theme]; let bg = t.bg.slice(), fg = t.fg.slice();
  if (S.gray){ const g = c => { const l = Math.round(.299 * c[0] + .587 * c[1] + .114 * c[2]); return [l, l, l]; }; bg = g(bg); fg = g(fg); }
  else if (S.tone){ const a = S.tone / 5; bg = [bg[0] + a * 14, bg[1] + a * 4, bg[2] - a * 22]; fg = [fg[0] + a * 6, fg[1] + a * 2, fg[2] - a * 9]; bg = bg.map(v => clamp(Math.round(v), 0, 255)); fg = fg.map(v => clamp(Math.round(v), 0, 255)); }
  const r = document.documentElement, st = r.style;
  st.setProperty('--bg', hex(bg)); st.setProperty('--fg', hex(fg));
  st.setProperty('--mid', hex(mixc(bg, fg, .55))); st.setProperty('--faint', hex(mixc(bg, fg, .18)));
  st.setProperty('--ink', hex(mixc(bg, fg, S.contrast / 100))); st.setProperty('--hlbg', hex(mixc(bg, fg, .26)));
  const dk = (0.299 * bg[0] + 0.587 * bg[1] + 0.114 * bg[2]) < 128, cd = dk ? bg : fg, cl = dk ? fg : bg;
  st.setProperty('--c0', hex(cd)); st.setProperty('--c1', hex(mixc(cd, cl, 1 / 3))); st.setProperty('--c2', hex(mixc(cd, cl, 2 / 3))); st.setProperty('--c3', hex(cl));
  r.dataset.theme = (S.theme === 'dark') ? 'dark' : 'light';
  r.classList.toggle('px', !!S.pixel);
  const m = $('meta[name=theme-color]'); if (m) m.content = hex(bg);
}
function applyDim(){ $('#dim').style.opacity = String((100 - S.dim) / 100); }

/* ================= storage ================= */
const DB = (() => {
  const STORES = ['books', 'content', 'trans', 'ab_books', 'ab_chunks', 'ab_audio', 'ab_model'];   // the last four belong to the audiobook feature
  let db = null, ok = false; const mem = Object.fromEntries(STORES.map(n => [n, new Map()]));
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open('inkleaf', 3); let bt = null;
      rq.onupgradeneeded = () => { const d = rq.result; STORES.forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:'id'}); }); };
      rq.onsuccess = () => {
        db = rq.result; ok = true; clearTimeout(bt);
        db.onversionchange = () => { try { db.close(); } catch(e){} setTimeout(() => { try { toast('PixaRead was updated in another tab. Reloading.'); } catch(e){} setTimeout(() => location.reload(), 1200); }, 0); };
        res(true);
      };
      rq.onerror = () => { clearTimeout(bt); res(false); };
      rq.onblocked = () => { setTimeout(() => { try { toast('Close other PixaRead tabs to finish updating.'); } catch(e){} }, 0); bt = setTimeout(() => res(false), 12000); };
    } catch(e){ res(false); }
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {
    open, persistent: () => ok,
    put: (s, v) => ok ? tx(s, 'readwrite', o => o.put(v)) : (mem[s].set(v.id, v), Promise.resolve()),
    get: (s, id) => ok ? tx(s, 'readonly', o => o.get(id)) : Promise.resolve(mem[s].get(id)),
    all: s => ok ? tx(s, 'readonly', o => o.getAll()) : Promise.resolve([...mem[s].values()]),
    del: (s, id) => ok ? tx(s, 'readwrite', o => o.delete(id)) : (mem[s].delete(id), Promise.resolve()),
    clear: s => ok ? tx(s, 'readwrite', o => o.clear()) : (mem[s].clear(), Promise.resolve())
  };
})();
let books = [];

/* ================= UI primitives ================= */
let toastT = null, toastFn = null;
function toast(msg, act){
  const t = $('#toast'); toastFn = act ? act.fn : null;
  t.innerHTML = `<span>${esc(msg)}</span>` + (act ? `<button data-act="toast-act">${esc(act.label)}</button>` : '');
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, act ? (act.long ? 7000 : 5000) : 2400);
}
let relayoutPending = false;
function flushRelayout(){ if (relayoutPending){ relayoutPending = false; relayoutSoon(); } }
const trunc = (t, n) => t.length > n ? t.slice(0, n) + '\u2026' : t;
function sheetUI(html, onAct){
  return new Promise(res => {
    const m = $('#modal'); m.className = 'msheet';
    m.innerHTML = `<div class="dlg bottom" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; m.onclick = null; m.className = ''; flushRelayout(); res(v); };
    m.onclick = e => {
      if (e.target === m){ if (onAct && onAct('cancel', m, done) === true) return; done({key: 'cancel'}); return; }
      const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k;
      if (onAct && onAct(k, m, done) === true) return;
      const vals = {}; m.querySelectorAll('input[id],textarea[id]').forEach(i => { vals[i.id] = i.value; });
      done({key: k, text: vals.noteIn || '', vals});
    };
  });
}
async function noteSheet(o){
  const html = `<div class="sh-head"><h2>${esc(o.title)}</h2><button class="ib" data-k="cancel" aria-label="Close">${ic('close', 2)}</button></div>
  ${o.quote ? `<div class="quote"><span class="${o.qstyle ? 'pv-' + o.qstyle : ''}">${esc(trunc(o.quote, 260))}</span></div>` : ''}
  <div class="field"><label class="lbl" for="noteIn">Your note</label><textarea id="noteIn" class="sinput note" maxlength="500" rows="5" placeholder="Write your thoughts\u2026">${esc(o.value || '')}</textarea><div class="mono cnt" id="noteCount">${(o.value || '').length}/500</div></div>
  <div class="sh-acts">${o.canDelete ? '<button class="btn danger full" data-k="delete">Delete note</button>' : ''}<button class="btn" data-k="cancel">Cancel</button><button class="btn solid" data-k="save">Save</button></div>`;
  setTimeout(() => { const t = $('#noteIn'); if (t){ t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch(e){} } }, 80);
  return sheetUI(html, (k, m, done) => {
    const ta = $('#noteIn'), acts = m.querySelector('.sh-acts'); if (!ta || !acts) return false;
    if (k === 'cancel' && ta.value.trim() !== (o.value || '').trim() && !acts.dataset.c){
      acts.dataset.c = acts.innerHTML;
      acts.innerHTML = '<p class="note" style="grid-column:1/-1;margin:0">Discard your changes?</p><button class="btn" data-k="keep">Keep editing</button><button class="btn danger" data-k="discard">Discard</button>';
      return true;
    }
    if (k === 'keep'){ acts.innerHTML = acts.dataset.c; delete acts.dataset.c; return true; }
    if (k === 'discard'){ done({key: 'cancel'}); return true; }
    return false;
  });
}
document.addEventListener('input', e => { if (e.target && e.target.id === 'noteIn'){ const c = $('#noteCount'); if (c) c.textContent = e.target.value.length + '/500'; } });
const accOpen = (id, def) => (S.acc && S.acc[id] != null) ? !!S.acc[id] : !!def;

async function addBook(p, {id, format}){
  const chapters = p.chapters.map(c => ({title: c.title, html: c.html, len: textLen(c.html), cont: !!c.cont})).filter(c => c.len > 0);
  if (chapters.length) chapters[0].cont = false;
  const lm = logicalMap(chapters);
  if (!chapters.length) throw new Error('No readable text found in this file.');
  const total = chapters.reduce((a, c) => a + c.len, 0);
  let art = null; if (!validCover(p.cover)){ try { art = Object.assign(smartSpec(infoOf(chapters, p.title || ''), id + '|' + (p.title || '')), {src: 'smart'}); } catch(e){} }
  const meta = {id, title: (p.title || 'Untitled').slice(0, 200), author: (p.author || '').slice(0, 200), format, lang: p.lang || '', added: Date.now(), lastOpened: 0, chapterCount: lm.count, chLogical: lm.map, total, pos: {ch: 0, off: 0}, progress: 0, bookmarks: [], annots: [], gv: p.gv || 0, cover: p.cover || '', art, kind: p.kind || '', note: p.note || ''};
  await DB.put('content', {id, chapters, doc: p.doc || null}); await DB.put('books', meta); books.push(meta); return meta;
}
async function importFile(file){
  const name = file.name, ext = (name.split('.').pop() || '').toLowerCase();
  const id = 'bk_' + hash(name + '|' + file.size + '|' + file.lastModified).toString(36);
  const ex = books.find(b => b.id === id); if (ex) return {dup: ex};
  const buf = await file.arrayBuffer(); let p, format;
  if (ext === 'epub'){ format = 'EPUB'; p = await parseEpub(buf, name); }
  else if (ext === 'pdf'){ format = 'PDF'; p = await parsePdf(buf, name); }
  else if (['html', 'htm', 'xhtml'].includes(ext)){ format = 'HTML'; p = parseHtml(decodeText(buf), name); }
  else if (['md', 'markdown'].includes(ext)){ format = 'MD'; p = parseMd(decodeText(buf), name); }
  else if (['txt', 'text'].includes(ext) || (file.type || '').startsWith('text/')){ format = 'TXT'; p = parseTxt(decodeText(buf), name); }
  else throw new Error('".' + ext + '" files are not supported. Supported formats: TXT, EPUB, PDF, HTML, MD.');
  busy('SAVING TO LIBRARY', 1);
  return {book: await addBook(p, {id, format})};
}
async function importFiles(files){
  files = [...files]; if (!files.length) return;
  let added = [], last = null;
  for (let i = 0; i < files.length; i++){
    busy(`IMPORTING ${i + 1}/${files.length}`, i / files.length);
    try {
      const r = await importFile(files[i]);
      if (r.dup){ last = r.dup; toast('ALREADY IN LIBRARY'); } else { added.push(r.book); last = r.book; }
    } catch(e){
      busy(null);
      const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
      await errorBox('COULD NOT IMPORT', (quota ? 'Not enough storage space on this device. Remove a book and try again.' : (e.message || 'Unknown error.')) + '\n\n' + files[i].name);
    }
  }
  busy(null);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if (added.length > 1){ toast(added.length + ' BOOKS ADDED'); show('library'); }
  else if (added.length === 1) openDetails(added[0].id);

}

function looksLikeCode(text){
  const ls = text.split('\n').filter(x => x.trim()); if (ls.length < 2) return /[{}();=<>]/.test(text);
  const code = r => /[{}();=<>\[\]\\]|^\s{2,}\S|->|=>|::|\/\/|\/\*|^\s*(?:def|class|function|import|return|var|let|const|if|for|while|public|private|#include)\b/.test(r);
  return ls.filter(code).length / ls.length >= 0.4;
}

  const lens = lines.map(l => l.trim().length).filter(Boolean).sort((a, b) => a - b), med = lens[lens.length >> 1] || 60, paras = []; let cur = '', prev = '';
  lines.forEach(ln => {
    const t = ln.trim(); if (!t){ if (cur){ paras.push(cur); cur = ''; } prev = ''; return; }
    if (cur){
      if (/[.!?"\u201D)]$/.test(prev) && prev.length < 0.75 * Math.max(med, 40) && /^[\p{Lu}"\u201C]/u.test(t)){ paras.push(cur); cur = t; }
      else cur = (/[A-Za-z]-$/.test(cur) && /^[a-z]/.test(t)) ? cur.slice(0, -1) + t : cur + ' ' + t;
    } else cur = t;
    prev = t;
  });
  if (cur) paras.push(cur); return paras;
}

  doc.chapters.forEach(c => { const out = []; c.blocks.forEach(b => {

}

const dayStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  if (S.goal && before < S.goal * 60 && stats[k] >= S.goal * 60) toast('Daily goal reached');
  const keys = Object.keys(stats).sort(); while (keys.length > 120) delete stats[keys.shift()];

}, 10000);
function statsLine(){
  const t = stats[dayStr(new Date())] || 0; let streak = 0; const d = new Date();
  if ((stats[dayStr(d)] || 0) < 60) d.setDate(d.getDate() - 1);
  while ((stats[dayStr(d)] || 0) >= 60 && streak < 400){ streak++; d.setDate(d.getDate() - 1); }
  if (!t && !streak && !S.goal) return '';
  const m = Math.round(t / 60);
  let h = `<div style="margin-bottom:14px"><div class="lbl">Today ${t && m < 1 ? '<1' : m} min${S.goal ? ' / ' + S.goal + ' min goal' : ''}${streak > 1 ? ' · ' + streak + '-day streak' : ''}</div>`;
  if (S.goal) h += `<div class="barrow" style="margin-top:6px"><span class="bar"><i style="width:${Math.min(100, Math.round(t / 60 / S.goal * 100))}%"></i></span></div>`;
  return h + '</div>';
}

async function loadUIDict(code, interactive, first){

function ctlLang(compact){
  const opts = Object.entries(LANGS).map(([c, l]) => `<option value="${esc(c)}" ${S.lang === c ? 'selected' : ''}>${esc(l.native)} · ${esc(l.name)}</option>`).join('');
  return `<div class="row"><div class="lbl"><span>Book language</span><span data-lbl="lang">${S.lang === 'orig' ? 'Original' : esc((LANGS[S.lang] || {}).name || '')}</span></div><select class="sinput" data-sel="lang" aria-label="Book language"><option value="orig" ${S.lang === 'orig' ? 'selected' : ''}>Original (no translation)</option>${opts}</select>${compact ? '' : LANG_NOTE}</div>`;
}

/* ================= device compatibility ================= */
const setVH = () => document.documentElement.style.setProperty('--vh', innerHeight + 'px');
setVH();
addEventListener('resize', () => { setVH(); relayoutSoon(); });
addEventListener('orientationchange', () => setTimeout(() => { setVH(); relayoutSoon(); }, 250));
let wheelT = 0;
rstage.addEventListener('wheel', e => {
  e.preventDefault(); const n = Date.now(); if (n - wheelT < 350) return;
  const d = e.deltaY || e.deltaX; if (Math.abs(d) < 2) return; wheelT = n; (d > 0 ? next : prev)();
}, {passive: false});
addEventListener('error', e => { if (e.error) toast('Something went wrong. Please try again.'); });

/* ================= ACTIONS ================= */
const ACT = {
  back: uiBack,
  import(){ $('#file').click(); },
  settings(){ closeSheet(); go('settings'); },
  'bookmarks-all'(){ bmScope = null; notesGlobal = true; go('bookmarks'); },
  'ab-lib'(){ if (PX.ab) go('audio'); else toast('Audiobooks are not available in this copy of PixaRead.'); },
  'ab-book'(){ if (PX.ab) PX.ab.openGenerator(detailId); else toast('Audiobooks are not available in this copy of PixaRead.'); },
  gtab(d){ nav.stack[nav.stack.length - 1] = d.v; notesGlobal = true; if (d.v === 'bookmarks') bmScope = null; show(d.v); },
  recent: async (d) => {
    const b = books.find(x => x.id === d.id); if (!b) return;
    if (b.progress <= 0.001){ openDetails(b.id); return; }
    const r = await dialog({title: 'Continue reading?', body: `<b>${esc(b.title)}</b><div class="big">${esc(chapLabel(b))}</div>`, actions: [{label: 'Continue', key: 'go', solid: true}, {label: 'Start over', key: 'zero'}, {label: 'Book details', key: 'info'}]});
    if (r === 'go') startReading(b.id); else if (r === 'zero') startReading(b.id, true); else if (r === 'info') openDetails(b.id);
  },
  details: d => openDetails(d.id),
  read: d => startReading(d.id),
  read0: d => startReading(d.id, true),
  del: d => softRemove(d.id),
  'edit-details': () => { const b = books.find(x => x.id === detailId); if (b) editDetails(b); },
  'toggle-finished': () => { const b = books.find(x => x.id === detailId); if (b) toggleFinished(b); },
  acc: d => { const el = document.querySelector('.acc[data-acc="' + d.id + '"]'); if (el) setAcc(el, el.querySelector(':scope > .acc-h').getAttribute('aria-expanded') !== 'true'); },
  help: () => openHelp(),
  'coach-ok': () => closeCoach(),
  'show-coach': () => { const m = $('#modal'); if (!m.hidden) m.click(); showCoach(true); },
  'del-all': async () => {
    if (!books.length){ toast('Library is empty'); return; }
    const r = await dialog({title: 'Remove all books?', body: `${books.length} book${books.length > 1 ? 's' : ''}, with progress and bookmarks, will be deleted from this device.`, actions: [{label: 'Remove all', key: 'yes', solid: true}, {label: 'Cancel', key: 'no'}]});
    if (r === 'yes'){ for (const b of books.slice()) await removeBook(b.id); toast('Library cleared'); rSettings(); }
  },
  guide: async () => {
    const ex = books.find(b => b.id === 'bk_guide'); if (ex){ openDetails(ex.id); return; }
    try { const m = await addBook(guideBook(), {id: 'bk_guide', format: 'TXT'}); openDetails(m.id); } catch(e){ errorBox('COULD NOT ADD', e.message); }
  },
  'd-toc': async () => { try { await ensureBook(detailId); } catch(e){ toast(e.message); return; } go('toc'); },
  'd-search': async () => { try { await ensureBook(detailId); } catch(e){ toast(e.message); return; } go('search'); },
  'd-bm': () => { bmScope = detailId; notesGlobal = false; go('bookmarks'); },
  prev, next,
  tts(){ if (tts.on) speakStop(); else speakStart(); },
  'tts-stop': () => speakStop(),
  'pick-cover': () => $('#coverfile').click(),
  'ai-cover': async () => {
    const b = books.find(x => x.id === detailId); if (!b) return;
    await getSample();
    if (!sampleFn){
      // Claude cannot be reached from this page (it only works while PixaRead is open inside Claude): draw a fresh scene from the book's own words instead
      try { const c = await DB.get('content', b.id); const sp = smartSpec(infoOf(c.chapters, b.title), b.id + '|' + b.title + '|' + Date.now()); b.art = Object.assign(sp, {src: 'smart'}); b.cover = ''; await saveBook(b); } catch(e){}
      toast('Claude is not available here, so a new scene was drawn from the book\u2019s own words. AI covers work when PixaRead is open inside Claude.');
      if (current === 'details') rDetails(); return;
    }
    const ctl = new AbortController(), stop = () => ctl.abort();
    busy('Claude is planning your cover\u2026', 0.1, stop);
    try {
      const c = await DB.get('content', b.id);
      const spec = await aiCoverSpec(b, c, {signal: ctl.signal, onText: ({text}) => busy('Claude is drawing the plan\u2026', Math.min(0.9, 0.2 + text.length / 900), stop)});
      b.art = Object.assign(spec, {src: 'ai'}); b.cover = ''; await saveBook(b); toast('Cover created');
    }
    catch(e){ const code = e && e.code; toast(code === 'cancelled' ? 'Stopped. Your cover was not changed.' : (COVER_MSG[code] || 'Could not create the cover. Try again later.')); }
    finally { busy(null); if (current === 'details') rDetails(); }
  },
  'redraw-cover': async () => {
    const b = books.find(x => x.id === detailId); if (!b) return;
    try { const c = await DB.get('content', b.id); const sp = smartSpec(infoOf(c.chapters, b.title), b.id + '|' + b.title + '|' + Date.now()); b.art = Object.assign(sp, {src: 'smart'}); b.cover = ''; await saveBook(b); } catch(e){}
    if (current === 'details') rDetails();
  },
  'rm-cover': async () => { const b = books.find(x => x.id === detailId); if (!b) return; b.cover = ''; try { await DB.put('books', JSON.parse(JSON.stringify(b))); } catch(e){} toast('Cover removed'); if (current === 'details') rDetails(); },
  'tts-speed': () => { const L = [0.75, 1, 1.25, 1.5, 2]; const i = L.findIndex(x => x > S.rate + 1e-6); setKey('rate', i < 0 ? L[0] : L[i]); },
  'trans-clear': async () => { try { const all = await DB.all('trans'); for (const r of all){ if (r.id.indexOf('ui|') !== 0) await DB.del('trans', r.id); } } catch(e){} R.tc = {}; R.tt = null; toast('Saved translations cleared'); },
  'tts-pause': () => speakPause(),
  'voice-test': () => speakChunks(SAMPLE),
  'a-hl': () => annotate('hl'), 'a-ul': () => annotate('ul'), 'a-mk': () => annotate('mk'),
  'sel-x': () => clearSel(),
  'sel-speak': () => { if (!selInfo) return; if (tts.sel) speakStop(); else speakSelection(selInfo.text); renderSelBar(); },
  'sel-copy': async () => { if (!selInfo) return; const ok = await copyText(selInfo.text); toast(ok ? 'Copied' : 'Could not copy'); },
  'sel-note': () => { const a = annotate('hl', true); if (a) editAnnotNote(a); },
  'sel-look': () => { if (!selInfo) return; const w = selInfo.text.split(/\s+/)[0].replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ''); if (!w) return; const win = window.open('https://en.wiktionary.org/wiki/' + encodeURIComponent(w.toLowerCase()), '_blank'); if (win){ try { win.opener = null; } catch(e){} } else toast('Pop-up blocked. Allow pop-ups to look up words.'); },
  'sel-share': async () => { if (!selInfo) return; const txt = '\u201C' + selInfo.text + '\u201D \u2014 ' + R.book.meta.title; try { if (navigator.share){ await navigator.share({text: txt}); return; } } catch(e){ if (e && e.name === 'AbortError') return; } const ok = await copyText(txt); toast(ok ? 'Copied to clipboard' : 'Could not share'); },
  'd-notes': async () => { notesGlobal = false; try { await ensureBook(detailId); } catch(e){ toast(e.message); return; } go('notes'); },
  'note-jump': async d => { const {b, a} = annotRef(d); if (!a) return; try { await ensureBook(b.id); } catch(e){ toast(e.message); return; } jumpTo(a.ch, annotOff(a)); },
  'note-speak': d => { const {a} = annotRef(d); if (a) speakSelection(a.text); },
  'note-edit': d => { const {b, a} = annotRef(d); if (a) editAnnotNote(a, b); },
  'note-del': d => { const {b, a} = annotRef(d); if (!a) return; b.annots = b.annots.filter(x => x !== a); persist(b); rNotes(); undoToast('Highlight removed', () => { b.annots.push(a); persist(b); if (current === 'notes') rNotes(); }); },
  'notes-copy': async () => { const ok = await copyText(notesText()); toast(ok ? 'All highlights copied' : 'Could not copy'); },
  jump: d => { const t = document.getElementById(d.id); if (t) t.scrollIntoView({block: 'start'}); },
  'reset-read': async () => {
    const r = await dialog({title: 'Reset reading settings?', body: 'Font, size, spacing, margins, alignment, layout and weight go back to the defaults.', actions: [{label: 'Reset', key: 'yes', solid: true}, {label: 'Cancel', key: 'no'}]});
    if (r === 'yes'){ ['font', 'size', 'line', 'margin', 'para', 'align', 'layout', 'weight'].forEach(k => { S[k] = DEF[k]; }); saveS(); applyReadStyle(); rSettings(); toast('Reading settings reset'); }
  },
  toc(){ closeSheet(); go('toc'); },
  search(){ closeSheet(); go('search'); },
  sheet: d => openSheet(d.k),
  theme(){ const ks = Object.keys(THEMES); const n = ks[(ks.indexOf(S.theme) + 1) % ks.length]; setKey('theme', n); toast(THEMES[n].n); },
  bookmark: toggleBookmark,
  tab(d){ if (!R.book) return; notesGlobal = false; if (d.v === 'bookmarks') bmScope = R.book.meta.id; nav.stack[nav.stack.length - 1] = d.v; show(d.v); },
  'toc-jump': d => { R.pendingHL = 0; jumpTo(+d.ch, 0); },
  'search-jump': d => { const r = sResults[+d.i]; if (r) jumpTo(r.ch, r.off, r.len); },
  'bm-jump': async d => { try { await ensureBook(d.b); } catch(e){ toast(e.message); return; } const m = R.book.meta.bookmarks.find(x => x.id === d.m); if (m){ R.book.meta.lastOpened = Date.now(); jumpTo(m.ch, m.off); } },
  'bm-del': async d => { const b = books.find(x => x.id === d.b); if (!b) return; const it = b.bookmarks.find(x => x.id === d.m); b.bookmarks = b.bookmarks.filter(x => x.id !== d.m); persist(b); rBookmarks(); undoToast('Bookmark removed', () => { b.bookmarks.push(it); persist(b); if (current === 'bookmarks') rBookmarks(); }); },
  'bm-note': d => { const b = books.find(x => x.id === d.b); const m = b && b.bookmarks.find(x => x.id === d.m); if (m) editNote(b, m); },
  set: (d) => setKey(d.k, JSON.parse(d.v)),
  step: (d) => stepKey(d.k, +d.d),
  fullscreen(){ if (!fsOk){ toast('Fullscreen is not available here'); return; } fsToggle(); },
  'toast-act'(){ const f = toastFn; $('#toast').hidden = true; if (f) f(); }
};
function jumpTo(ch, off, hl){
  R.ch = ch; R.off = off; R.pendingHL = hl || 0;
  nav.stack = ['library', 'reader']; flow.innerHTML = ''; show('reader');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (!$('#modal').hidden && !el.closest('#modal')) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset, el);
});
$('#coverfile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f || !detailId) return;
  try { const b = books.find(x => x.id === detailId); b.cover = coverArt(await loadBitmap(f), false); await DB.put('books', JSON.parse(JSON.stringify(b))); toast('Cover updated'); if (current === 'details') rDetails(); }
  catch(err){ toast('Could not read that image'); }
});
$('#file').addEventListener('change', e => { const f = e.target.files; importFiles(f).finally(() => { e.target.value = ''; }); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });

/* ================= init ================= */
(async function init(){
  const cells = [...document.querySelectorAll('#splash .load i')], lab = $('#splash-pct'); let n = 0;
  const splashDone = new Promise(res => {
    const tick = setInterval(() => {
      if (n < cells.length){ cells[n].classList.add('on'); n++; lab.textContent = Math.round(n / cells.length * 100) + '%'; }
      else { clearInterval(tick); setTimeout(res, 250); }
    }, 100);
  });
  applyTheme(); applyDim(); applyReadStyle(); getSample();
  $('.ctl.top [data-act=back]').innerHTML = ic('back');
  const ok = await DB.open();
  try { books = await DB.all('books'); } catch(e){ books = []; }
  const og = books.find(b => b.id === 'bk_guide' && b.gv !== 3);
  if (og){ try { await removeBook('bk_guide'); await addBook(guideBook(), {id: 'bk_guide', format: 'TXT'}); } catch(e){} }
  await applyUILang(true);
  show('library'); setTimeout(autoArt, 1500);
  await splashDone;
  $('#splash').hidden = true;
  if (!ok) toast('Storage unavailable: books will not be kept after closing');
  else { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){} }
})();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  const had = !!navigator.serviceWorker.controller;
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    const ask = w => toast('A new version of PixaRead is ready.', {label: 'Update', long: true, fn: () => { w.postMessage('SKIP_WAITING'); }});
    if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); }); });
  }).catch(() => {}));
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || reloading) return; reloading = true; location.reload(); });
}
})();
</script>
