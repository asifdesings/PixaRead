<style>
/* ===== DESIGN SYSTEM =====
 Color    : 4 tokens per theme (bg, fg, mid, faint) + ink (reading text, contrast-adjusted). Monochrome only.
 Type     : Silkscreen (pixel labels) / IBM Plex Mono (data) / Literata (titles + reading).
 Space    : 4 · 8 · 12 · 16 · 24 · 32
 Borders  : 2px solid in Pixel mode (stepped corners), 1px otherwise. No shadows, no gradients, no motion.
 Targets  : 44-48px minimum.
*/
:root{
  --bg:#EDE7D8;--fg:#23211D;--mid:#7A7568;--faint:#CFC8B6;--ink:#23211D;--hlbg:#D3CCBA;
  --f-label:'Silkscreen','Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-serif:'Literata',Georgia,'Times New Roman',serif;
  --bw:1px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --fx:16px;--pad:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2A2A2A;--fg:#C4C4C0;--mid:#8A8A86;--faint:#3C3C3C;--ink:#C4C4C0}}
:root[data-theme="dark"]{--bg:#2A2A2A;--fg:#C4C4C0;--mid:#8A8A86;--faint:#3C3C3C;--ink:#C4C4C0}
html.px{--bw:2px}
html{height:100%;height:var(--vh,100%);scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-serif);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border-radius:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
::selection{background:var(--fg);color:var(--bg)}

/* stepped pixel corners */
html.px .btn,html.px .ib,html.px .seg,html.px .card,html.px .dlg,html.px .toast,html.px .cover,html.px .recent,html.px .step,html.px .sb button,html.px .pill{
  clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px));
}

.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:var(--bg)}
.hdr{flex:none;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:var(--bw) solid var(--fg)}
.hdr h1{flex:1;margin:0;font-family:var(--f-label);font-size:16px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4)}
.foot{flex:none;padding:var(--s3) var(--s4);border-top:var(--bw) solid var(--fg);background:var(--bg)}
.lbl{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--mid)}
.sec{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin:var(--s5) 0 var(--s2)}
.sec:first-child{margin-top:0}

.btn{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:48px;padding:0 var(--s4);border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2)}
.btn.wide{width:100%}
.btn.solid,.btn:active{background:var(--fg);color:var(--bg)}
.btn:focus-visible{background:var(--fg);color:var(--bg);outline:none}
.btn.solid:active{background:var(--bg);color:var(--fg)}
.btn.danger{border-style:dashed}
.ib{width:48px;height:48px;flex:none;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);display:grid;place-items:center;padding:0;font-family:var(--f-label);font-size:12px}
.ib.plain{border-color:transparent}
.ib:active,.ib.on{background:var(--fg);color:var(--bg)}
.ib:focus-visible{background:var(--fg);color:var(--bg);outline:none}
.ic{display:block;fill:currentColor}

/* segmented control */
.seg{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:var(--bw);background:var(--fg);border:var(--bw) solid var(--fg)}
.seg button{min-height:44px;border:0;background:var(--bg);color:var(--fg);font-family:var(--f-label);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:var(--s1) var(--s2)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.step{display:grid;grid-template-columns:56px 1fr 56px;gap:var(--bw);background:var(--fg);border:var(--bw) solid var(--fg)}
.step button,.step output{min-height:44px;background:var(--bg);display:grid;place-items:center;border:0;font-family:var(--f-mono);font-size:14px}
.step button{font-family:var(--f-label);font-size:16px}
.step button:active{background:var(--fg);color:var(--bg)}

.row{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) 0;border-bottom:1px dotted var(--mid)}
.row>.lbl{display:flex;justify-content:space-between}
.preview{border:var(--bw) solid var(--fg);padding:var(--s4);margin:var(--s2) 0 var(--s3);color:var(--ink)}
.note{font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--mid);margin:var(--s2) 0}
.card{border:var(--bw) solid var(--fg);padding:var(--s4);margin:var(--s3) 0}

/* covers & bars */
.cover{flex:none;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);display:block;overflow:hidden}
.cover svg{display:block;width:100%;height:100%}
.cover.sm{width:44px;height:62px}.cover.md{width:60px;height:84px}.cover.lg{width:96px;height:134px}
.bar{height:10px;border:var(--bw) solid var(--fg);background:var(--bg);flex:1}
html.px .bar{background:repeating-conic-gradient(var(--mid) 0 25%,var(--bg) 0 50%) 0 0/4px 4px}
.bar>i{display:block;height:100%;background:var(--fg)}
.barrow{display:flex;align-items:center;gap:var(--s3)}

/* library */
.recent{display:flex;gap:var(--s4);width:100%;text-align:left;border:var(--bw) solid var(--fg);background:var(--bg);padding:var(--s4)}
.recent:active{background:var(--faint)}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2);justify-content:center}
.t{font-family:var(--f-serif);font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.a{font-family:var(--f-serif);font-size:14px;color:var(--mid)}
.book{display:flex;gap:var(--s3);width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted var(--mid);padding:var(--s3) 0;align-items:center}
.book:active{background:var(--faint)}
.book .t{font-size:16px}
.book .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--mid);flex:none}
.empty{text-align:center;padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s4)}
.empty p{font-family:var(--f-mono);font-size:13px;color:var(--mid);margin:0;max-width:30ch;line-height:1.5}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--mid);text-align:center;margin-top:var(--s2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);margin:var(--s4) 0}
.dl dt{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;align-self:center}
.dl dd{margin:0;font-family:var(--f-mono);font-size:13px;text-align:right}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.trio{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.trio .btn{padding:0 var(--s2);font-size:11px}

/* list screens */
.li{display:flex;align-items:stretch;border-bottom:1px dotted var(--mid)}
.li>.main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:var(--s3) 0;display:flex;flex-direction:column;gap:4px;min-height:56px;justify-content:center}
.li>.main:active{background:var(--faint)}
.li .t{font-size:16px;font-weight:400}
.li.cur .t{font-weight:700}
.li.cur .main::before{content:"> ";font-family:var(--f-label)}
.li .side{display:flex;align-items:center;gap:var(--s1)}
.li mark,.snip mark{background:var(--fg);color:var(--bg);padding:0 1px}
.snip{font-family:var(--f-serif);font-size:15px;line-height:1.4}
.bmnote{font-style:italic;font-size:14px;color:var(--ink)}
.tabs{padding:var(--s3) var(--s4);flex:none;border-bottom:var(--bw) solid var(--fg)}
.sinput{width:100%;min-height:48px;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);font-family:var(--f-mono);font-size:16px;padding:0 var(--s3);border-radius:0}
.sinput:focus{outline:none;background:var(--faint)}
textarea.sinput{padding:var(--s3);min-height:96px;resize:none;font-family:var(--f-serif)}

/* reader */
#s-reader{background:var(--bg)}
.stage{position:absolute;top:0;right:0;bottom:0;left:0;touch-action:none;-webkit-user-select:text;user-select:text}
.viewport{position:absolute;overflow:hidden}
.flow{position:absolute;left:0;top:0;column-fill:auto;color:var(--ink);font-kerning:normal;text-rendering:optimizeLegibility;font-variant-ligatures:common-ligatures;font-feature-settings:"kern" 1,"liga" 1;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;orphans:2;widows:2;-webkit-font-smoothing:auto}
.flow p{margin:0 0 var(--para,0)}
.flow.indent p+p{text-indent:1.5em}
.flow h1,.flow h2,.flow h3,.flow h4,.flow h5,.flow h6{font-family:inherit;font-weight:700;line-height:1.25;margin:1.2em 0 .6em;break-after:avoid;-webkit-hyphens:manual;hyphens:manual;text-align:left;text-indent:0}
.flow h1{font-size:1.5em}.flow h2{font-size:1.3em}.flow h3{font-size:1.15em}.flow h4,.flow h5,.flow h6{font-size:1em}
.flow>:first-child{margin-top:0}
.flow blockquote{margin:1em 0 1em 1em;padding-left:.9em;border-left:2px solid var(--mid)}
.flow blockquote p{text-indent:0!important}
.flow pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.82em;line-height:1.5;margin:1em 0;text-align:left}
.flow code{font-family:var(--f-mono);font-size:.88em}
.flow ul,.flow ol{margin:.6em 0;padding-left:1.5em}
.flow li p{margin:0;text-indent:0!important}
.flow hr{border:0;margin:1.2em 0;text-align:center;height:1em}
.flow hr::after{content:"* * *";letter-spacing:.3em;color:var(--mid)}
.flow sup,.flow sub{font-size:.7em;line-height:0}
::highlight(srch){background:var(--fg);color:var(--bg)}
.rfoot{position:absolute;left:0;right:0;bottom:0;height:30px;padding:0 var(--fx);display:flex;justify-content:space-between;align-items:center;gap:var(--s4);font-family:var(--f-mono);font-size:11px;color:var(--mid);pointer-events:none}
.rfoot span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfoot span:last-child{flex:none}
.notch{position:absolute;top:0;pointer-events:none;color:var(--fg)}
.fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:9;opacity:0}
.ctl{position:absolute;left:0;right:0;background:var(--bg);z-index:5}
.ctl.top{top:0;border-bottom:var(--bw) solid var(--fg);display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3)}
.ctl.top .tt{flex:1;min-width:0}
.ctl.top .tt div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl.bottom{bottom:0;border-top:var(--bw) solid var(--fg)}
.scrubrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4) 0}
.scrubrow .lbl{min-width:54px;text-align:center;font-size:10px}
.btnrow{display:flex;gap:var(--s1);padding:var(--s2) var(--s2) var(--s3)}
.btnrow .ib{flex:1;width:auto;min-width:0;border-color:transparent}
.btnrow .ib.on,.btnrow .ib:active{border-color:var(--fg)}
.sheet{max-height:58vh;overflow-y:auto;padding:var(--s2) var(--s4) var(--s3);border-bottom:var(--bw) solid var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:36px;background:transparent;margin:0;min-width:0}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:var(--bw);background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:28px;margin-top:calc((var(--bw) - 28px)/2);background:var(--fg);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:var(--bw);background:var(--fg)}
input[type=range]::-moz-range-thumb{width:18px;height:28px;background:var(--fg);border:0;border-radius:0}

/* overlays */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:grid;place-items:center;padding:var(--s5);background:repeating-conic-gradient(var(--faint) 0 25%,transparent 0 50%) 0 0/4px 4px}
.dlg{width:100%;max-width:420px;background:var(--bg);border:var(--bw) solid var(--fg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.dlg h2{margin:0;font-family:var(--f-label);font-size:14px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.dbody{font-family:var(--f-serif);font-size:16px;line-height:1.45}
.dbody .big{font-family:var(--f-mono);font-size:15px;margin-top:var(--s2)}
.dacts{display:flex;flex-direction:column;gap:var(--s2)}
#busy{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;display:grid;place-items:center;padding:var(--s5);background:var(--bg)}
#busy .in{width:100%;max-width:340px;display:flex;flex-direction:column;gap:var(--s4);text-align:center}
.toast{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:var(--s3) var(--s4);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:48px;max-width:520px;margin:0 auto}
.toast button{background:var(--bg);color:var(--fg);border:0;font-family:var(--f-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-height:36px;padding:0 var(--s3)}
#dim{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;pointer-events:none;z-index:100;opacity:0}
a{color:inherit}
:focus-visible{outline:2px dashed var(--fg);outline-offset:2px}

@media (max-width:360px){.t{font-size:16px}.trio .btn{font-size:9px}}

@supports (padding:max(1px,2px)){:root{--pad:max(16px,calc((100% - 720px)/2))}}
.hdr,.foot,.tabs,.scroll,.scrubrow,.sheet{padding-left:var(--pad);padding-right:var(--pad)}
.ctl.top{padding-left:calc(var(--pad) - 4px);padding-right:calc(var(--pad) - 4px)}
.btnrow{padding-left:calc(var(--pad) - 8px);padding-right:calc(var(--pad) - 8px)}
.flow p,.flow h1,.flow h2,.flow h3,.flow h4,.flow h5,.flow h6,.flow li{unicode-bidi:plaintext}

.brand{text-transform:none!important;letter-spacing:.14em}
.hdr h1.hb{display:flex;align-items:center;gap:10px}
.hdr h1.hb>span.col{display:flex;flex-direction:column;gap:5px;min-width:0}
.dlg{max-height:92%;overflow-y:auto}
.sheet{max-height:calc(var(--vh,100vh)*.58)}
#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#splash h1{margin:0;font-family:var(--f-label);font-weight:700;font-size:32px;letter-spacing:.14em;line-height:1}
#splash .tag{font-family:var(--f-label);font-size:11px;letter-spacing:.18em;color:var(--mid)}
#splash .load{width:min(280px,72vw);border:var(--bw) solid var(--fg);padding:4px;display:flex;gap:2px}
#splash .load i{flex:1;height:14px;background:var(--faint)}
#splash .load i.on{background:var(--fg)}
#splash .pct{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;color:var(--mid);min-height:14px}
#splash .ver{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--f-mono);font-size:11px;color:var(--mid)}
html.px #splash .load{clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}

.flow .h-hl{background:var(--hlbg)}
.flow .h-ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em}
.flow .h-mk{background:var(--fg);color:var(--bg)}
.pv-hl{background:var(--hlbg)}
.pv-ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em}
.pv-mk{background:var(--fg);color:var(--bg)}
.selbar{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:var(--bw) solid var(--fg);padding:8px var(--pad);display:flex;flex-direction:column;gap:6px;-webkit-user-select:none;user-select:none}
.selbar.at-top{top:0;bottom:auto;border-top:0;border-bottom:var(--bw) solid var(--fg)}
.sb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sb button{min-height:48px;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);font-family:var(--f-label);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px;display:flex;align-items:center;justify-content:center;gap:4px}
.sb button:active{background:var(--fg);color:var(--bg)}

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const stripTags = h => h.replace(/<[^>]*>/g, '');
const nameToTitle = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim() || 'Untitled';
function textLen(html){ const t = document.createElement('template'); t.innerHTML = html; return t.content.textContent.length; }
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ================= pixel icons ================= */
const ICONS = {
  back:['....#....','...##....','..###....','.########','#########','.########','..###....','...##....','....#....'],
  close:['##.....##','###...###','.###.###.','..#####..','...###...','..#####..','.###.###.','###...###','##.....##'],
  plus:['....#....','....#....','....#....','....#....','#########','....#....','....#....','....#....','....#....'],
  search:['.#####...','#.....#..','#.....#..','#.....#..','#.....#..','#.....#..','.#####...','......##.','.......##'],
  toc:['##.######','.........','##.######','.........','##.######','.........','##.######','.........','##.######'],
  bm:['.#######.','.#.....#.','.#.....#.','.#.....#.','.#.....#.','.#.....#.','.#.....#.','..#...#..','...#.#...','....#....'],
  bmf:['.#######.','.#######.','.#######.','.#######.','.#######.','.#######.','.#######.','..#####..','...###...','....#....'],
  sliders:['..###....','#########','..###....','.........','.........','.....###.','#########','.....###.','.........'],
  sun:['....#....','.#..#..#.','...###...','..#####..','#.#####.#','..#####..','...###...','.#..#..#.','....#....'],
  theme:['..#####..','.####..#.','#####...#','#####...#','#####...#','#####...#','#####...#','.####..#.','..#####..'],
  trash:['...###...','#########','.#.....#.','.#.#.#.#.','.#.#.#.#.','.#.#.#.#.','.#.#.#.#.','.#.....#.','.#######.'],
  edit:['......##.','.....####','....####.','...####..','..####...','.####....','#####....','##.......'],
  logo:['########...', '#......##..', '#......#.#.', '#......####', '#.........#', '#.#######.#', '#.........#', '#.#######.#', '#.........#', '#.#####...#', '#.........#', '#.#######.#', '#.........#', '###########'],
  speaker:['...#.....','..##...#.','####.#..#','####..#.#','####..#.#','####.#..#','..##...#.','...#.....'],
  chev:['#....','##...','###..','####.','#####','####.','###..','##...','#....']
};
function ic(name, cell = 3, flip = false){
  let rows = ICONS[name]; if (flip) rows = rows.map(r => r.split('').reverse().join(''));
  const h = rows.length, w = rows[0].length; let d = '';
  rows.forEach((r, y) => { const m = r.matchAll(/#+/g); for (const x of m) d += `M${x.index} ${y}h${x[0].length}v1h-${x[0].length}z`; });
  return `<svg class="ic" width="${w * cell}" height="${h * cell}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}"/></svg>`;
}
function coverSvg(seed){
  const h = hash(seed); let bits = h, d = '';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 3; x++){
    const on = (hash(seed + ':' + y + ':' + x) >> 3) & 1;
    if (on){ d += `M${5 + x * 8} ${7 + y * 8}h8v8h-8z`; if (x < 2) d += `M${5 + (4 - x) * 8} ${7 + y * 8}h8v8h-8z`; }
  }
  return `<svg viewBox="0 0 50 70" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="${d}"/><path fill="none" stroke="currentColor" stroke-width="1" d="M2.5 2.5h45v65h-45z"/></svg>`;
}
const cover = (b, size) => `<span class="cover ${size}">${coverSvg(b.title + b.id)}</span>`;

/* ================= settings ================= */
const DEF = {theme:'paper',font:'lit',size:20,line:1.55,margin:2,para:0,align:'left',layout:'single',pixel:true,contrast:100,tone:0,gray:false,footer:true,turn:'both',hand:'right',orient:'auto',wake:true,refresh:'subtle',dim:100,sort:'recent',weight:'normal',eta:true,auto:0,rate:1,goal:0,voice:'',vstyle:'female',pitch:1};
let S = {...DEF};
try {
  const raw = localStorage.getItem('inkleaf.s');
  if (raw) S = {...DEF, ...JSON.parse(raw)};
  else if (matchMedia('(prefers-color-scheme: dark)').matches) S.theme = 'dark';
} catch(e){}
const saveS = () => { try { localStorage.setItem('inkleaf.s', JSON.stringify(S)); } catch(e){} };
const THEMES = {
  paper:{n:'Paper',bg:[237,231,216],fg:[35,33,29]},
  classic:{n:'Classic e-ink',bg:[208,208,203],fg:[42,42,42]},
  high:{n:'High contrast',bg:[255,255,255],fg:[10,10,10]},
  dark:{n:'Dark e-ink',bg:[42,42,42],fg:[196,196,192]}
};
if (!THEMES[S.theme]) S.theme = 'paper';
const FONTS = {
  lit:{n:'Literata',f:"Literata,Georgia,serif"},
  mer:{n:'Merriweather',f:"Merriweather,Georgia,serif"},
  ser:{n:'Serif',f:"'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"},
  atk:{n:'Atkinson',f:"'Atkinson Hyperlegible',system-ui,sans-serif"},
  san:{n:'Sans',f:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"},
  mon:{n:'Mono',f:"'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace"},
  pxl:{n:'Pixel',f:"'Pixelify Sans','Silkscreen',ui-monospace,Menlo,monospace",z:1.05},
  vt:{n:'Terminal',f:"VT323,'IBM Plex Mono',ui-monospace,Menlo,monospace",z:1.4}
};
if (!FONTS[S.font]) S.font = 'lit';
const MX = [8,18,28,40,56], MY = [12,18,24,30,38];
const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const hex = c => '#' + c.map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
function applyTheme(){
  const t = THEMES[S.theme]; let bg = t.bg.slice(), fg = t.fg.slice();
  if (S.gray){ const g = c => { const l = Math.round(.299 * c[0] + .587 * c[1] + .114 * c[2]); return [l, l, l]; }; bg = g(bg); fg = g(fg); }
  else if (S.tone){ const a = S.tone / 5; bg = [bg[0] + a * 14, bg[1] + a * 4, bg[2] - a * 22]; fg = [fg[0] + a * 6, fg[1] + a * 2, fg[2] - a * 9]; bg = bg.map(v => clamp(Math.round(v), 0, 255)); fg = fg.map(v => clamp(Math.round(v), 0, 255)); }
  const r = document.documentElement, st = r.style;
  st.setProperty('--bg', hex(bg)); st.setProperty('--fg', hex(fg));
  st.setProperty('--mid', hex(mixc(bg, fg, .55))); st.setProperty('--faint', hex(mixc(bg, fg, .18)));
  st.setProperty('--ink', hex(mixc(bg, fg, S.contrast / 100))); st.setProperty('--hlbg', hex(mixc(bg, fg, .26)));
  r.dataset.theme = (S.theme === 'dark') ? 'dark' : 'light';
  r.classList.toggle('px', !!S.pixel);
  const m = $('meta[name=theme-color]'); if (m) m.content = hex(bg);
}
function applyDim(){ $('#dim').style.opacity = String((100 - S.dim) / 100); }

/* ================= storage ================= */
const DB = (() => {
  let db = null, ok = false; const mem = {books:new Map(), content:new Map()};
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open('inkleaf', 1);
      rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('books', {keyPath:'id'}); d.createObjectStore('content', {keyPath:'id'}); };
      rq.onsuccess = () => { db = rq.result; ok = true; res(true); };
      rq.onerror = () => res(false); rq.onblocked = () => res(false);
    } catch(e){ res(false); }
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {
    open, persistent: () => ok,
    put: (s, v) => ok ? tx(s, 'readwrite', o => o.put(v)) : (mem[s].set(v.id, v), Promise.resolve()),
    get: (s, id) => ok ? tx(s, 'readonly', o => o.get(id)) : Promise.resolve(mem[s].get(id)),
    all: s => ok ? tx(s, 'readonly', o => o.getAll()) : Promise.resolve([...mem[s].values()]),
    del: (s, id) => ok ? tx(s, 'readwrite', o => o.delete(id)) : (mem[s].delete(id), Promise.resolve())
  };
})();
let books = [];

/* ================= UI primitives ================= */
let toastT = null, toastFn = null;
function toast(msg, act){
  const t = $('#toast'); toastFn = act ? act.fn : null;
  t.innerHTML = `<span>${esc(msg)}</span>` + (act ? `<button data-act="toast-act">${esc(act.label)}</button>` : '');
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, act ? 5000 : 2400);
}
function dialog({title, body, actions, input}){
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body ? `<div class="dbody">${body}</div>` : ''}${input != null ? `<textarea class="sinput" id="dlgIn" maxlength="300" placeholder="Note (optional)">${esc(input)}</textarea>` : ''}<div class="dacts">${actions.map((a, i) => `<button class="btn ${a.solid ? 'solid' : ''} ${a.danger ? 'danger' : ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; m.onclick = null; res(v); };
    m.onclick = e => { const b = e.target.closest('button[data-i]'); if (!b) return; const a = actions[+b.dataset.i]; done(input != null ? {key:a.key, text:($('#dlgIn') || {}).value || ''} : a.key); };
    if (input != null) setTimeout(() => { const i = $('#dlgIn'); if (i) i.focus(); }, 40);
  });
}
function busy(msg, frac){
  const b = $('#busy');
  if (msg == null){ b.hidden = true; b.innerHTML = ''; return; }
  b.hidden = false;
  b.innerHTML = `<div class="in"><div class="lbl">${esc(msg)}</div><div class="bar"><i style="width:${Math.round((frac || 0) * 100)}%"></i></div></div>`;
}
const errorBox = (title, msg) => dialog({title, body: esc(msg), actions: [{label:'OK', key:'ok', solid:true}]});

/* ================= text → blocks ================= */
const mk = (html, h, title) => ({html, h: h || 0, title: title || '', len: stripTags(html).length});
const SKIP = new Set(['SCRIPT','STYLE','SVG','NOSCRIPT','HEAD','LINK','META','IFRAME','OBJECT','AUDIO','VIDEO','CANVAS','SELECT','BUTTON','INPUT','TEXTAREA','NAV','TITLE','IMG','PICTURE','MATH','TEMPLATE']);
const BLOCK = new Set(['DIV','SECTION','ARTICLE','MAIN','HEADER','FOOTER','ASIDE','FIGURE','TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','DL','ADDRESS','DETAILS','FORM','FIELDSET','CENTER','BODY','HTML']);
const INL = {EM:'em',I:'em',CITE:'em',STRONG:'strong',B:'strong',SUP:'sup',SUB:'sub',CODE:'code',SMALL:'small',Q:'q'};
function inl(n){
  if (n.nodeType === 3) return esc(n.nodeValue.replace(/\s+/g, ' '));
  if (n.nodeType !== 1) return '';
  const t = n.tagName; if (SKIP.has(t)) return '';
  if (t === 'BR') return '<br>';
  const inner = [...n.childNodes].map(inl).join('');
  return INL[t] ? `<${INL[t]}>${inner}</${INL[t]}>` : inner;
}
function sanitize(root){
  const walk = (parent, out) => {
    let buf = '';
    const flush = () => { if (stripTags(buf).replace(/&nbsp;|\s/g, '')) out.push(mk('<p>' + buf.trim() + '</p>')); buf = ''; };
    for (const n of parent.childNodes){
      if (n.nodeType === 3){ buf += esc(n.nodeValue.replace(/\s+/g, ' ')); continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName;
      if (SKIP.has(t)) continue;
      if (/^H[1-6]$/.test(t)){
        flush(); const h = [...n.childNodes].map(inl).join('').trim(); const tx = n.textContent.replace(/\s+/g, ' ').trim();
        if (tx) out.push(mk(`<${t.toLowerCase()}>${h}</${t.toLowerCase()}>`, +t[1], tx)); continue;
      }
      if (t === 'P' || t === 'DT' || t === 'DD' || t === 'SUMMARY' || t === 'FIGCAPTION' || t === 'CAPTION'){
        flush(); const h = [...n.childNodes].map(inl).join('').trim(); if (stripTags(h).trim()) out.push(mk('<p>' + h + '</p>')); continue;
      }
      if (t === 'PRE'){ flush(); const tx = n.textContent.replace(/\n+$/, ''); if (tx.trim()) out.push(mk('<pre>' + esc(tx) + '</pre>')); continue; }
      if (t === 'HR'){ flush(); out.push(mk('<hr>')); continue; }
      if (t === 'UL' || t === 'OL'){
        flush(); const items = [];
        for (const li of n.children){ if (li.tagName === 'LI'){ const sub = []; walk(li, sub); const h = sub.map(b => b.html).join(''); if (h) items.push('<li>' + h + '</li>'); } }
        const tg = t.toLowerCase(); if (items.length) out.push(mk(`<${tg}>${items.join('')}</${tg}>`)); continue;
      }
      if (t === 'BLOCKQUOTE'){ flush(); const sub = []; walk(n, sub); if (sub.length) out.push(mk('<blockquote>' + sub.map(b => b.html).join('') + '</blockquote>')); continue; }
      if (t === 'BR'){ buf += '<br>'; continue; }
      if (BLOCK.has(t)){ flush(); walk(n, out); continue; }
      buf += inl(n);
    }
    flush();
  };
  const out = []; walk(root, out); return out;
}
function chunk(title, blocks, limit = 70000, target = 40000){
  const total = blocks.reduce((a, b) => a + b.len, 0);
  if (total <= limit) return [{title, html: blocks.map(b => b.html).join('')}];
  const parts = []; let cur = [], n = 0, k = 1;
  for (const b of blocks){
    cur.push(b); n += b.len;
    if (n >= target){ parts.push({title: k === 1 ? title : `${title} · ${k}`, html: cur.map(x => x.html).join('')}); cur = []; n = 0; k++; }
  }
  if (cur.length) parts.push({title: k === 1 ? title : `${title} · ${k}`, html: cur.map(x => x.html).join('')});
  return parts;
}
function assemble(blocks, title, level){
  const chs = []; let cur = null;
  const start = t => { cur = {title: t, blocks: [], body: 0}; chs.push(cur); };
  for (const b of blocks){
    const split = level && b.h && b.h <= level;
    if (split && (!cur || cur.body >= 150)) start(b.title || ('Section ' + (chs.length + 1)));
    else if (!cur) start(title);
    cur.blocks.push(b); if (!b.h) cur.body += b.len;
  }
  return chs.flatMap(c => chunk(c.title, c.blocks));
}

/* ---- decoders ---- */
function decodeText(buf){
  const u = new Uint8Array(buf);
  if (u[0] === 0xFF && u[1] === 0xFE) return new TextDecoder('utf-16le').decode(u);
  if (u[0] === 0xFE && u[1] === 0xFF) return new TextDecoder('utf-16be').decode(u);
  try { return new TextDecoder('utf-8', {fatal: true}).decode(u); } catch(e){ return new TextDecoder('windows-1252').decode(u); }
}
/* ---- TXT ---- */
function parseTxt(text, name){
  text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  let title = (text.match(/^Title:\s*(.+)$/m) || [])[1], author = (text.match(/^Author:\s*(.+)$/m) || [])[1];
  const s = text.search(/\*\*\* ?START OF (THE|THIS) PROJECT GUTENBERG[^\n]*\n/i);
  if (s >= 0) text = text.slice(text.indexOf('\n', s) + 1);
  const e = text.search(/\*\*\* ?END OF (THE|THIS) PROJECT GUTENBERG/i);
  if (e >= 0) text = text.slice(0, e);
  title = (title || '').trim() || nameToTitle(name); author = (author || '').trim();
  const blocks0 = text.split(/\n[ \t]*\n+/).map(b => b.trim()).filter(Boolean);
  let paras = [];
  if (blocks0.length >= 3){
    for (const b of blocks0){
      if (!b.includes('\n')){ paras.push({t: b}); continue; }
      const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
      const avg = lines.reduce((a, l) => a + l.length, 0) / lines.length;
      if (lines.length > 3 && avg < 45) paras.push({t: lines.join('\n'), verse: true});
      else paras.push({t: lines.join(' ')});
    }
  } else paras = text.split('\n').map(l => l.trim()).filter(Boolean).map(t => ({t}));
  const HEAD = /^(chapter|book|part|section|act|canto|prologue|epilogue|preface|introduction|foreword|afterword|appendix)\b/i;
  const NUM = /^(?:[IVXLCDM]{1,8}|\d{1,3})\.?$/;
  const blocks = paras.map(p => {
    const t = p.t;
    if (!p.verse && t.length <= 80 && !t.includes('\n') && (HEAD.test(t) || NUM.test(t))) return mk('<h2>' + esc(t) + '</h2>', 1, t);
    return mk('<p>' + esc(t).replace(/\n/g, '<br>') + '</p>');
  });
  const level = blocks.filter(b => b.h).length >= 2 ? 1 : 0;
  return {title, author, chapters: assemble(blocks, title, level)};
}
/* ---- Markdown ---- */
function mdInline(s){
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (m, a, b) => `<strong>${a || b}</strong>`);
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>').replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, '$1<em>$2</em>');
  return s;
}
function parseMd(text, name){
  text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const lines = text.split('\n'); const blocks = []; let i = 0, title = '';
  const isStart = l => /^(#{1,6})\s+/.test(l) || /^\s*(```|~~~)/.test(l) || /^\s*>/.test(l) || /^\s*([-*+]|\d+\.)\s+/.test(l) || /^\s*(---+|\*\*\*+|___+)\s*$/.test(l);
  while (i < lines.length){
    const l = lines[i];
    if (!l.trim()){ i++; continue; }
    let m;
    if (/^\s*(```|~~~)/.test(l)){ const code = []; i++; while (i < lines.length && !/^\s*(```|~~~)/.test(lines[i])) code.push(lines[i++]); i++; blocks.push(mk('<pre>' + esc(code.join('\n')) + '</pre>')); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){ const n = m[1].length; if (n === 1 && !title) title = m[2]; blocks.push(mk(`<h${n}>${mdInline(m[2])}</h${n}>`, n, m[2].replace(/[*_`]/g, ''))); i++; continue; }
    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(l)){ blocks.push(mk('<hr>')); i++; continue; }
    if (/^\s*>/.test(l)){ const q = []; while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, '')); blocks.push(mk('<blockquote><p>' + mdInline(q.join(' ')) + '</p></blockquote>')); continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)){
      const ord = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) items.push('<li>' + mdInline(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, '')) + '</li>');
      blocks.push(mk(ord ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`)); continue;
    }
    const p = []; while (i < lines.length && lines[i].trim() && !isStart(lines[i])) p.push(lines[i++].trim());
    if (!p.length){ p.push(lines[i++]); }
    blocks.push(mk('<p>' + mdInline(p.join(' ')) + '</p>'));
  }
  if (!blocks.length) throw new Error('This file has no readable text.');
  const h1 = blocks.filter(b => b.h === 1).length, h2 = blocks.filter(b => b.h === 2).length;
  const level = h1 >= 2 ? 1 : (h2 >= 2 ? 2 : 0);
  title = title || nameToTitle(name);
  return {title, author: '', chapters: assemble(blocks, title, level)};
}
/* ---- HTML ---- */
function fixXhtml(s){ return s.replace(/<title\s*\/>/gi, '').replace(/<(script|style)\b[^>]*\/>/gi, ''); }
const tx = n => (n && n.textContent) ? n.textContent.trim() : '';
function parseHtml(text, name){
  const doc = new DOMParser().parseFromString(fixXhtml(text), 'text/html');
  const title = tx(doc.querySelector('title')) || tx(doc.querySelector('h1')) || nameToTitle(name);
  const author = (doc.querySelector('meta[name=author]') || {}).content || '';
  const blocks = sanitize(doc.body);
  if (!blocks.length) throw new Error('This file has no readable text.');
  const h1 = blocks.filter(b => b.h === 1).length, h2 = blocks.filter(b => b.h === 2).length;
  const level = h1 >= 2 ? 1 : (h2 >= 2 ? 2 : 0);
  return {title: title.slice(0, 200), author, lang: doc.documentElement.lang || '', chapters: assemble(blocks, title, level)};
}
/* ---- libraries (loaded on demand, only for EPUB / PDF) ---- */
const LIBS = {
  zip: ['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'],
  pdf: ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js']
};
const loaded = {};
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    const to = setTimeout(() => rej(new Error('timeout')), 25000);
    s.onload = () => { clearTimeout(to); res(); }; s.onerror = () => { clearTimeout(to); rej(new Error('load')); };
    document.head.appendChild(s);
  });
}
async function loadLib(k){
  if (loaded[k]) return;
  try { for (const u of LIBS[k]) await loadScript(u); }
  catch(e){ throw new Error('The ' + (k === 'zip' ? 'EPUB' : 'PDF') + ' reader component could not be downloaded. Connect to the internet once and try again. TXT, HTML and Markdown import work without it.'); }
  if (k === 'pdf') window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdf[1];
  loaded[k] = true;
}
/* ---- EPUB ---- */
async function parseEpub(buf, name){
  await loadLib('zip');
  let zip; try { zip = await JSZip.loadAsync(buf); } catch(e){ throw new Error('This EPUB file could not be opened (it may be damaged or DRM-protected).'); }
  const rd = async p => { p = p.replace(/^\/+/, ''); let f = zip.file(p); if (!f){ try { f = zip.file(decodeURIComponent(p)); } catch(e){} } return f ? await f.async('string') : null; };
  const X = s => new DOMParser().parseFromString(s, 'application/xml');
  const cont = await rd('META-INF/container.xml'); if (!cont) throw new Error('Not a valid EPUB (container.xml missing).');
  const rootPath = (X(cont).getElementsByTagNameNS('*', 'rootfile')[0] || {getAttribute: () => null}).getAttribute('full-path');
  if (!rootPath) throw new Error('Not a valid EPUB (package file missing).');
  const opfText = await rd(rootPath); if (!opfText) throw new Error('Not a valid EPUB (package file unreadable).');
  const opf = X(opfText);
  const dir = rootPath.includes('/') ? rootPath.slice(0, rootPath.lastIndexOf('/') + 1) : '';
  const join = (base, rel) => { rel = rel.split('#')[0]; try { rel = decodeURIComponent(rel); } catch(e){} const out = []; for (const p of (base + rel).split('/')){ if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); } return out.join('/'); };
  const meta = tag => { const e = opf.getElementsByTagNameNS('*', tag)[0]; return e ? e.textContent.trim() : ''; };
  const manifest = {};
  for (const it of opf.getElementsByTagNameNS('*', 'item')) manifest[it.getAttribute('id')] = {href: it.getAttribute('href') || '', type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || ''};
  const spine = [...opf.getElementsByTagNameNS('*', 'itemref')].map(r => manifest[r.getAttribute('idref')]).filter(Boolean);
  const titles = {};
  try {
    const nav = Object.values(manifest).find(m => /\bnav\b/.test(m.props));
    if (nav){
      const np = join(dir, nav.href), s = await rd(np);
      if (s){
        const d = new DOMParser().parseFromString(fixXhtml(s), 'text/html'); const navs = [...d.querySelectorAll('nav')];
        const toc = navs.find(n => /toc/.test(n.getAttribute('epub:type') || n.getAttribute('type') || '')) || navs[0];
        const nd = np.includes('/') ? np.slice(0, np.lastIndexOf('/') + 1) : '';
        if (toc) for (const a of toc.querySelectorAll('a[href]')){ const k = join(nd, a.getAttribute('href')); const t = a.textContent.replace(/\s+/g, ' ').trim(); if (t && !(k in titles)) titles[k] = t; }
      }
    }
    if (!Object.keys(titles).length){
      const ncx = Object.values(manifest).find(m => m.type === 'application/x-dtbncx+xml');
      if (ncx){
        const np = join(dir, ncx.href), s = await rd(np);
        if (s){
          const d = X(s), nd = np.includes('/') ? np.slice(0, np.lastIndexOf('/') + 1) : '';
          for (const p of d.getElementsByTagNameNS('*', 'navPoint')){
            const lb = p.getElementsByTagNameNS('*', 'text')[0], ct = p.getElementsByTagNameNS('*', 'content')[0];
            if (lb && ct){ const k = join(nd, ct.getAttribute('src') || ''); const t = lb.textContent.replace(/\s+/g, ' ').trim(); if (t && !(k in titles)) titles[k] = t; }
          }
        }
      }
    }
  } catch(e){}
  const chapters = []; let n = 0;
  for (const it of spine){
    n++; busy(`IMPORTING ${n}/${spine.length}`, n / spine.length);
    if (!/html|xml/.test(it.type)) continue;
    const p = join(dir, it.href); const s = await rd(p); if (!s) continue;
    const doc = new DOMParser().parseFromString(fixXhtml(s), 'text/html');
    const blocks = sanitize(doc.body); if (!blocks.length) continue;
    let title = titles[p]; if (!title){ const h = blocks.find(b => b.h && b.h <= 3); title = h ? h.title : ''; }
    chapters.push(...chunk(title || 'Section ' + (chapters.length + 1), blocks));
    if (n % 6 === 0) await sleep(0);
  }
  if (!chapters.length) throw new Error('No readable text found in this EPUB.');
  return {title: meta('title') || nameToTitle(name), author: meta('creator'), lang: meta('language').slice(0, 5), chapters, note: 'Images and complex layout are not shown.'};
}
/* ---- PDF ---- */
function pdfPage(tc){
  const lines = []; let cur = null;
  for (const it of tc.items){
    if (typeof it.str !== 'string' || (!it.str && !it.hasEOL)) continue;
    const y = it.transform[5], x = it.transform[4], h = Math.abs(it.transform[3]) || it.height || 10;
    if (cur && Math.abs(y - cur.y) < h * .5){
      const gap = x - cur.endX; cur.t += ((gap > h * .15 && !cur.t.endsWith(' ') && !it.str.startsWith(' ')) ? ' ' : '') + it.str; cur.endX = x + (it.width || 0);
    } else { cur = {y, h, t: it.str, endX: x + (it.width || 0)}; lines.push(cur); }
  }
  const L = lines.filter(l => l.t.trim());
  if (!L.length) return [];
  const gaps = []; for (let i = 1; i < L.length; i++){ const d = L[i - 1].y - L[i].y; if (d > 0) gaps.push(d); }
  gaps.sort((a, b) => a - b); const med = gaps.length ? gaps[gaps.length >> 1] : 14;
  const hs = L.map(l => l.h).sort((a, b) => a - b), medH = hs[hs.length >> 1];
  const out = []; let buf = '';
  const flush = () => { if (buf){ out.push({t: buf}); buf = ''; } };
  L.forEach((l, i) => {
    const t = l.t.trim();
    if (l.h >= medH * 1.3 && t.length < 90 && !/[.,;]$/.test(t)){ flush(); out.push({t, head: true}); return; }
    if (!buf){ buf = t; return; }
    const dy = L[i - 1].y - l.y;
    if (dy > med * 1.6 || dy < 0){ flush(); buf = t; }
    else if (/[A-Za-z]-$/.test(buf)) buf = buf.slice(0, -1) + t;
    else buf += ' ' + t;
  });
  flush(); return out;
}
async function parsePdf(buf, name){
  await loadLib('pdf');
  let doc; try { doc = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise; } catch(e){ throw new Error('This PDF could not be opened (it may be damaged or password-protected).'); }
  const n = doc.numPages, pages = []; let chars = 0;
  for (let p = 1; p <= n; p++){
    busy(`READING PAGE ${p}/${n}`, p / n);
    const pg = await doc.getPage(p); const tc = await pg.getTextContent();
    const paras = pdfPage(tc); chars += paras.reduce((a, q) => a + q.t.length, 0);
    pages.push(paras.map(q => q.head ? mk('<h3>' + esc(q.t) + '</h3>', 3, q.t) : mk('<p>' + esc(q.t) + '</p>')));
    pg.cleanup(); if (p % 4 === 0) await sleep(0);
  }
  if (chars < 40) throw new Error('This PDF has no selectable text (it looks like scanned images). OCR is not supported.');
  let starts = [];
  try {
    const out = await doc.getOutline();
    if (out) for (const it of out){
      let d = it.dest; if (typeof d === 'string') d = await doc.getDestination(d);
      if (Array.isArray(d)){ const idx = await doc.getPageIndex(d[0]); starts.push({title: (it.title || '').trim(), page: idx}); }
    }
  } catch(e){}
  starts = starts.filter((s, i, a) => s.title && a.findIndex(x => x.page === s.page) === i).sort((a, b) => a.page - b.page);
  const chapters = [];
  const add = (title, a, b) => { const bl = pages.slice(a, b).flat(); if (bl.length) chapters.push(...chunk(title, bl)); };
  if (starts.length >= 2){
    if (starts[0].page > 0) add('Front matter', 0, starts[0].page);
    starts.forEach((s, i) => add(s.title, s.page, i + 1 < starts.length ? starts[i + 1].page : n));
  } else for (let a = 0; a < n; a += 10) add(`Pages ${a + 1}–${Math.min(n, a + 10)}`, a, a + 10);
  let md = null; try { md = await doc.getMetadata(); } catch(e){}
  const info = (md && md.info) || {};
  return {title: (info.Title || '').trim() || nameToTitle(name), author: (info.Author || '').trim(), chapters, note: 'PDF text is reflowed. Columns, figures and tables may read out of order.'};
}

/* ================= library data ================= */
async function addBook(p, {id, format}){
  const chapters = p.chapters.map(c => ({title: c.title, html: c.html, len: textLen(c.html)})).filter(c => c.len > 0);
  if (!chapters.length) throw new Error('No readable text found in this file.');
  const total = chapters.reduce((a, c) => a + c.len, 0);
  const meta = {id, title: (p.title || 'Untitled').slice(0, 200), author: (p.author || '').slice(0, 200), format, lang: p.lang || 'en', added: Date.now(), lastOpened: 0, chapterCount: chapters.length, total, pos: {ch: 0, off: 0}, progress: 0, bookmarks: [], annots: [], gv: p.gv || 0, note: p.note || ''};
  await DB.put('content', {id, chapters}); await DB.put('books', meta); books.push(meta); return meta;
}
async function importFile(file){
  const name = file.name, ext = (name.split('.').pop() || '').toLowerCase();
  const id = 'bk_' + hash(name + '|' + file.size + '|' + file.lastModified).toString(36);
  const ex = books.find(b => b.id === id); if (ex) return {dup: ex};
  const buf = await file.arrayBuffer(); let p, format;
  if (ext === 'epub'){ format = 'EPUB'; p = await parseEpub(buf, name); }
  else if (ext === 'pdf'){ format = 'PDF'; p = await parsePdf(buf, name); }
  else if (['html', 'htm', 'xhtml'].includes(ext)){ format = 'HTML'; p = parseHtml(decodeText(buf), name); }
  else if (['md', 'markdown'].includes(ext)){ format = 'MD'; p = parseMd(decodeText(buf), name); }
  else if (['txt', 'text'].includes(ext) || (file.type || '').startsWith('text/')){ format = 'TXT'; p = parseTxt(decodeText(buf), name); }
  else throw new Error('".' + ext + '" files are not supported. Supported formats: TXT, EPUB, PDF, HTML, MD.');
  busy('SAVING TO LIBRARY', 1);
  return {book: await addBook(p, {id, format})};
}
async function importFiles(files){
  files = [...files]; if (!files.length) return;
  let added = [], last = null;
  for (let i = 0; i < files.length; i++){
    busy(`IMPORTING ${i + 1}/${files.length}`, i / files.length);
    try {
      const r = await importFile(files[i]);
      if (r.dup){ last = r.dup; toast('ALREADY IN LIBRARY'); } else { added.push(r.book); last = r.book; }
    } catch(e){
      busy(null);
      const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
      await errorBox('COULD NOT IMPORT', (quota ? 'Not enough storage space on this device. Remove a book and try again.' : (e.message || 'Unknown error.')) + '\n\n' + files[i].name);
    }
  }
  busy(null);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if (added.length > 1){ toast(added.length + ' BOOKS ADDED'); show('library'); }
  else if (added.length === 1) openDetails(added[0].id);
  else if (last) openDetails(last.id);
}
async function removeBook(id){
  await DB.del('books', id); await DB.del('content', id);
  books = books.filter(b => b.id !== id);
  if (R.book && R.book.meta.id === id){ R.book = null; }
}

const ago = t => { if (!t) return 'NEVER OPENED'; const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'TODAY' : d === 1 ? 'YESTERDAY' : d < 14 ? d + 'D AGO' : d < 60 ? Math.floor(d / 7) + 'W AGO' : new Date(t).toLocaleDateString(); };

function sortedBooks(){

    }

  }
}
function refreshAnnots(){
  clearHL(); const keep = R.page;
  flow.innerHTML = R.book.chapters[R.ch].html; wrapAnnots(); collectNodes(); measure();
  R.page = Math.min(keep, R.pages - 1); place(); updateUI();
}
function selToOffsets(r){
  let s = -1, e = -1;
  for (let i = 0; i < R.nodes.length; i++){
    const nd = R.nodes[i]; let hit = false; try { hit = r.intersectsNode(nd); } catch(x){}
    if (!hit) continue;
    const len = nd.nodeValue.length;
    const a = nd === r.startContainer ? r.startOffset : 0, b = nd === r.endContainer ? r.endOffset : len;
    if (b <= a) continue;
    if (s < 0) s = R.starts[i] + a; e = R.starts[i] + b;
  }
  if (s < 0 || e <= s) return null;
  const t = chapText(R.ch);
  while (s < e && /\s/.test(t[s])) s++; while (e > s && /\s/.test(t[e - 1])) e--;
  if (e - s < 1) return null;
  return {ch: R.ch, s, e, text: t.slice(s, e)};
}
function renderSelBar(){
  if (!selInfo) return; const words = selInfo.text.split(/\s+/).length;
  selbar.innerHTML = `<div class="sb"><button data-act="a-hl"><span class="pv-hl">Highlight</span></button><button data-act="a-ul"><span class="pv-ul">Underline</span></button><button data-act="a-mk"><span class="pv-mk">Mark</span></button><button data-act="sel-x" aria-label="Close">${ic('close', 2)}</button></div><div class="sb"><button data-act="sel-speak">${ic('speaker', 2)}${tts.sel ? 'Stop' : 'Speak'}</button><button data-act="sel-copy">Copy</button><button data-act="sel-note">Note</button>${words <= 3 ? '<button data-act="sel-look">Look up</button>' : '<button data-act="sel-share">Share</button>'}</div>`;
}
function checkSel(){
  if (barDown || current !== 'reader' || !R.book) return;
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount){ selbar.hidden = true; selInfo = null; return; }
  const r = sel.getRangeAt(0);
  if (!flow.contains(r.commonAncestorContainer)){ selbar.hidden = true; selInfo = null; return; }
  const info = selToOffsets(r); if (!info){ selbar.hidden = true; selInfo = null; return; }
  selInfo = info; if (ctlOpen) setCtl(false);
  const rc = r.getBoundingClientRect(), sr = rstage.getBoundingClientRect();
  selbar.classList.toggle('at-top', rc.top - sr.top > sr.height * 0.5);
  renderSelBar(); selbar.hidden = false;
}
function clearSel(){ try { const s = getSelection(); if (s && s.removeAllRanges) s.removeAllRanges(); } catch(e){} selbar.hidden = true; selInfo = null; }
selbar.addEventListener('mousedown', e => e.preventDefault());
selbar.addEventListener('pointerdown', () => { barDown = true; });
['pointerup', 'pointercancel'].forEach(ev => selbar.addEventListener(ev, () => setTimeout(() => { barDown = false; }, 700)));
document.addEventListener('selectionchange', () => { if (current !== 'reader') return; clearTimeout(selT); selT = setTimeout(checkSel, 220); });
function annotate(st, quiet){
  if (!selInfo) return null; const m = R.book.meta;
  const ex = m.annots.find(a => a.ch === selInfo.ch && a.s === selInfo.s && a.e === selInfo.e && a.st === st);
  if (ex && quiet) return ex;
  if (ex){ m.annots = m.annots.filter(a => a !== ex); saveNow(); clearSel(); refreshAnnots(); toast('Removed'); return null; }
  const a = {id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ch: selInfo.ch, s: selInfo.s, e: selInfo.e, st, text: selInfo.text, note: '', t: Date.now()};
  m.annots.push(a); saveNow(); clearSel(); refreshAnnots();
  if (!quiet) toast({hl: 'Highlighted', ul: 'Underlined', mk: 'Marked'}[st], {label: 'Add note', fn: () => editAnnotNote(a)});
  return a;
}
async function editAnnotNote(a){
  const r = await dialog({title: 'Note', body: `<span class="pv-${a.st}">${esc(a.text.length > 160 ? a.text.slice(0, 160) + '\u2026' : a.text)}</span>`, input: a.note || '', actions: [{label: 'Save note', key: 'ok', solid: true}, {label: 'Cancel', key: 'no'}]});
  if (r && r.key === 'ok'){ a.note = r.text.trim(); saveNow(); if (current === 'notes') rNotes(); }
}
async function openAnnot(id){

  const r = await dialog({title: STY[a.st], body: `<span class="pv-${a.st}">${esc(a.text.length > 240 ? a.text.slice(0, 240) + '\u2026' : a.text)}</span>${a.note ? `<div class="bmnote" style="margin-top:10px">${esc(a.note)}</div>` : ''}`, actions: [{label: 'Read aloud', key: 'speak', solid: true}, {label: a.note ? 'Edit note' : 'Add note', key: 'note'}, {label: 'Change style', key: 'style'}, {label: 'Remove', key: 'del', danger: true}, {label: 'Close', key: 'x'}]});
  if (r === 'speak') speakSelection(a.text);
  else if (r === 'note') editAnnotNote(a);
  else if (r === 'style'){ const ks = ['hl', 'ul', 'mk']; a.st = ks[(ks.indexOf(a.st) + 1) % 3]; saveNow(); refreshAnnots(); toast('Style: ' + STY[a.st]); }
  else if (r === 'del'){ R.book.meta.annots = R.book.meta.annots.filter(x => x !== a); saveNow(); refreshAnnots(); toast('Highlight removed'); }
}
function notesText(){
  const m = R.book.meta; let out = m.title + (m.author ? ' \u2014 ' + m.author : '') + '\n\n';
  for (const a of m.annots.slice().sort((x, y) => x.ch - y.ch || x.s - y.s)){
    out += '\u201C' + a.text + '\u201D\n(' + STY[a.st] + ', ' + (R.book.chapters[a.ch] ? R.book.chapters[a.ch].title : '') + ', ' + Math.round((R.chapStart[a.ch] + a.s) / R.total * 100) + '%)\n' + (a.note ? 'Note: ' + a.note + '\n' : '') + '\n';
  }
  return out.trim();
}
async function copyText(t){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } } catch(e){}
  try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}
function rNotes(){
  const el = $('#s-notes'); if (!R.book){ el.innerHTML = ''; return; }
  const old = $('.scroll', el); const top = old ? old.scrollTop : 0;
  const list = R.book.meta.annots.slice().sort((a, b) => a.ch - b.ch || a.s - b.s);
  let h = `<header class="hdr"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h1>Highlights</h1>${list.length ? '<button class="btn" data-act="notes-copy">Copy all</button>' : ''}</header>${tabs('notes')}<div class="scroll">`;
  if (!list.length) h += '<div class="empty"><p>No highlights yet. While reading, press and hold a word, drag to select, then choose Highlight, Underline or Mark.</p></div>';
  for (const a of list){
    const ex = a.text.length > 160 ? a.text.slice(0, 160) + '\u2026' : a.text, ch = R.book.chapters[a.ch];
    h += `<div class="li"><button class="main" data-act="note-jump" data-id="${esc(a.id)}"><span class="snip"><span class="pv-${a.st}">${esc(ex)}</span></span><span class="mono">${esc(STY[a.st])} · ${esc(ch ? ch.title : '')} · ${Math.round((R.chapStart[a.ch] + a.s) / R.total * 100)}%</span>${a.note ? `<span class="bmnote">${esc(a.note)}</span>` : ''}</button><span class="side"><button class="ib plain" data-act="note-speak" data-id="${esc(a.id)}" aria-label="Read aloud">${ic('speaker', 2)}</button><button class="ib plain" data-act="note-edit" data-id="${esc(a.id)}" aria-label="Edit note">${ic('edit', 2)}</button><button class="ib plain" data-act="note-del" data-id="${esc(a.id)}" aria-label="Remove highlight">${ic('trash', 2)}</button></span></div>`;
  }
  el.innerHTML = h + '</div>'; const sc = $('.scroll', el); if (sc) sc.scrollTop = top;
}
function libRows(){
  const q = libq.trim().toLowerCase();
  const list = sortedBooks().filter(b => !q || b.title.toLowerCase().indexOf(q) >= 0 || (b.author || '').toLowerCase().indexOf(q) >= 0);

document.addEventListener('input', e => { if (e.target && e.target.id === 'libq'){ libq = e.target.value; const l = $('#liblist'); if (l) l.innerHTML = libRows(); } });
document.addEventListener('change', e => { const el = e.target && e.target.closest ? e.target.closest('select[data-sel]') : null; if (el) setKey(el.dataset.sel, el.value || ''); });
let tipsShown = false;
async function showTips(){
  if (tipsShown) return; let seen = false; try { seen = localStorage.getItem('inkleaf.tips') === '1'; } catch(e){}
  tipsShown = true; if (seen) return; try { localStorage.setItem('inkleaf.tips', '1'); } catch(e){}

let autoT = null;
function armAuto(){
  clearTimeout(autoT);
  if (!S.auto || current !== 'reader' || ctlOpen || tts.on) return;
  autoT = setTimeout(() => {
    if (document.hidden || current !== 'reader' || ctlOpen || !$('#modal').hidden){ armAuto(); return; }

const dayStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let stats = {}; try { stats = JSON.parse(localStorage.getItem('inkleaf.stats') || '{}'); } catch(e){}
let lastAct = Date.now();
['pointerdown', 'keydown', 'wheel'].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, true));
setInterval(() => {
  if (current !== 'reader' || document.hidden) return;
  if (Date.now() - lastAct > 120000 && !tts.on && !S.auto) return;
  const k = dayStr(new Date()); const before = stats[k] || 0; stats[k] = before + 10;
  if (S.goal && before < S.goal * 60 && stats[k] >= S.goal * 60) toast('Daily goal reached');
  const keys = Object.keys(stats).sort(); while (keys.length > 120) delete stats[keys.shift()];
  try { localStorage.setItem('inkleaf.stats', JSON.stringify(stats)); } catch(e){}
}, 10000);
function statsLine(){
  const t = stats[dayStr(new Date())] || 0; let streak = 0; const d = new Date();
  if ((stats[dayStr(d)] || 0) < 60) d.setDate(d.getDate() - 1);
  while ((stats[dayStr(d)] || 0) >= 60 && streak < 400){ streak++; d.setDate(d.getDate() - 1); }
  if (!t && !streak && !S.goal) return '';
  const m = Math.round(t / 60);
  let h = `<div style="margin-bottom:14px"><div class="lbl">Today ${t && m < 1 ? '<1' : m} min${S.goal ? ' / ' + S.goal + ' min goal' : ''}${streak > 1 ? ' · ' + streak + '-day streak' : ''}</div>`;
  if (S.goal) h += `<div class="barrow" style="margin-top:6px"><span class="bar"><i style="width:${Math.min(100, Math.round(t / 60 / S.goal * 100))}%"></i></span></div>`;
  return h + '</div>';
}

/* ================= ACTIONS ================= */
const ACT = {

  settings(){ closeSheet(); go('settings'); },
  'bookmarks-all'(){ bmScope = null; go('bookmarks'); },
  recent: async (d) => {

    if (r === 'go') startReading(b.id); else if (r === 'zero') startReading(b.id, true); else if (r === 'info') openDetails(b.id);
  },
  details: d => openDetails(d.id),
  read: d => startReading(d.id),
  read0: d => startReading(d.id, true),
  del: async d => {

  },
  'del-all': async () => {
    if (!books.length){ toast('Library is empty'); return; }

  },
  guide: async () => {

  'd-toc': async () => { try { await ensureBook(detailId); } catch(e){ toast(e.message); return; } go('toc'); },
  'd-search': async () => { try { await ensureBook(detailId); } catch(e){ toast(e.message); return; } go('search'); },
  'd-bm': () => { bmScope = detailId; go('bookmarks'); },
  prev, next,
  tts(){ if (tts.on) speakStop(); else speakStart(); },
  'tts-stop': () => speakStop(),
  'tts-pause': () => speakPause(),
  'voice-test': () => speakChunks(SAMPLE),
  'a-hl': () => annotate('hl'), 'a-ul': () => annotate('ul'), 'a-mk': () => annotate('mk'),
  'sel-x': () => clearSel(),
  'sel-speak': () => { if (!selInfo) return; if (tts.sel) speakStop(); else speakSelection(selInfo.text); renderSelBar(); },
  'sel-copy': async () => { if (!selInfo) return; const ok = await copyText(selInfo.text); toast(ok ? 'Copied' : 'Could not copy'); },
  'sel-note': () => { const a = annotate('hl', true); if (a) editAnnotNote(a); },
  'sel-look': () => { if (!selInfo) return; const w = selInfo.text.split(/\s+/)[0].replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ''); if (!w) return; const win = window.open('https://en.wiktionary.org/wiki/' + encodeURIComponent(w.toLowerCase()), '_blank'); if (win){ try { win.opener = null; } catch(e){} } else toast('Pop-up blocked. Allow pop-ups to look up words.'); },
  'sel-share': async () => { if (!selInfo) return; const txt = '\u201C' + selInfo.text + '\u201D \u2014 ' + R.book.meta.title; try { if (navigator.share){ await navigator.share({text: txt}); return; } } catch(e){ if (e && e.name === 'AbortError') return; } const ok = await copyText(txt); toast(ok ? 'Copied to clipboard' : 'Could not share'); },
  'd-notes': async () => { try { await ensureBook(detailId); } catch(e){ toast(e.message); return; } go('notes'); },
  'note-jump': d => { const a = R.book.meta.annots.find(x => x.id === d.id); if (a) jumpTo(a.ch, a.s); },
  'note-speak': d => { const a = R.book.meta.annots.find(x => x.id === d.id); if (a) speakSelection(a.text); },
  'note-edit': d => { const a = R.book.meta.annots.find(x => x.id === d.id); if (a) editAnnotNote(a); },
  'note-del': d => { const m = R.book.meta; m.annots = m.annots.filter(x => x.id !== d.id); saveNow(); rNotes(); toast('Highlight removed'); },
  'notes-copy': async () => { const ok = await copyText(notesText()); toast(ok ? 'All highlights copied' : 'Could not copy'); },
  jump: d => { const t = document.getElementById(d.id); if (t) t.scrollIntoView({block: 'start'}); },
  'reset-read': async () => {

    if (r === 'yes'){ ['font', 'size', 'line', 'margin', 'para', 'align', 'layout', 'weight'].forEach(k => { S[k] = DEF[k]; }); saveS(); applyReadStyle(); rSettings(); toast('Reading settings reset'); }
  },
  toc(){ closeSheet(); go('toc'); },

  bookmark: toggleBookmark,

  'bm-jump': async d => { try { await ensureBook(d.b); } catch(e){ toast(e.message); return; } const m = R.book.meta.bookmarks.find(x => x.id === d.m); if (m){ R.book.meta.lastOpened = Date.now(); jumpTo(m.ch, m.off); } },

  set: (d) => setKey(d.k, JSON.parse(d.v)),

  'toast-act'(){ const f = toastFn; $('#toast').hidden = true; if (f) f(); }
